<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sync UI states</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../css/sync.css">
<style>
    body { margin: 0; padding: 24px; background: var(--bg-primary); }
    /* Use the real overlay positioning, so this fixture shows what users see. */
</style>
</head>
<body>
<!--
    Visual fixture for the "Your work" dialog. Each connect/project state can be
    rendered without touching GitHub, so the panel can be looked at rather than
    only syntax-checked. The markup below mirrors the dialog in index.html.

        serve the repo root, then open
        tests/visual.html?state=idle|code|connecting|workspace|connected|error|offline|empty
                              &theme=light|dark
-->
<div class="stage">
    <div id="status-slot"></div>
    <div class="overlay sync-overlay">
        <div class="overlay-backdrop"></div>
        <div class="overlay-content" role="dialog" aria-modal="true" aria-labelledby="sync-title">
            <div class="overlay-header">
                <h2 id="sync-title">Your work</h2>
                <button id="close-sync" class="btn btn-close" aria-label="Close Your work">&times;</button>
            </div>
            <div class="sync-body">
                <section class="sync-section" aria-labelledby="sync-github-heading">
                    <h3 class="sync-section-label" id="sync-github-heading">In your GitHub repository</h3>
                    <div id="connect-slot"></div>
                </section>
                <section class="sync-section" aria-labelledby="sync-local-heading">
                    <h3 class="sync-section-label" id="sync-local-heading">On this device</h3>
                    <div id="projects-slot"></div>
                </section>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { mountConnect } from '../js/ui/connect.js';
    import { mountStatus } from '../js/ui/status.js';
    import { mountProjects } from '../js/ui/projects.js';

    const SAMPLE_PROJECTS = [
        { name: 'spiral', syncState: 'saved' },
        { name: 'shapes', syncState: 'local' },
    ];

    /** Minimal stand-in for the real sync service. */
    function stub(state) {
        const listeners = new Set();
        const api = {
            status: 'signed-out',
            identity: null,
            workspace: null,
            error: null,
            projects: SAMPLE_PROJECTS,
            onStatus(fn) { listeners.add(fn); return () => listeners.delete(fn); },
            beginSignIn({ onCode }) {
                onCode({
                    userCode: 'WDJB-MJHT',
                    verificationUri: 'https://github.com/login/device',
                    expiresIn: 900,
                });
                return new Promise(() => {});
            },
            cancelSignIn() {},
            async connect() {},
            async createWorkspace() {},
            async disconnect() {},
            async listProjects() {
                return api.projects;
            },
            set(patch) {
                Object.assign(api, patch);
                for (const fn of listeners) fn(api);
            },
        };
        Object.assign(api, state);
        return api;
    }

    const wanted = new URLSearchParams(location.search).get('state') || 'idle';
    const wantedTheme = new URLSearchParams(location.search).get('theme');
    if (wantedTheme === 'light' || wantedTheme === 'dark') {
        document.documentElement.dataset.theme = wantedTheme;
    }

    const signedIn = { login: 'p0142', name: 'p0142' };
    const vault = { owner: 'p0142', repo: 'pydle' };

    const states = {
        idle: { status: 'signed-out' },
        code: { status: 'signed-out' },
        connecting: { status: 'connecting' },
        workspace: { status: 'connected', identity: signedIn },
        connected: { status: 'connected', identity: signedIn, workspace: vault },
        error: {
            status: 'error',
            identity: signedIn,
            workspace: vault,
            error: { kind: 'auth', message: 'GitHub rejected the sign-in.' },
        },
        offline: { status: 'offline', identity: signedIn, workspace: vault },
        empty: { status: 'signed-out', projects: [] },
    };

    const sync = stub(states[wanted] || states.idle);
    mountStatus(document.getElementById('status-slot'), sync);
    const connect = mountConnect(document.getElementById('connect-slot'), sync);
    mountProjects(document.getElementById('projects-slot'), sync, {
        onOpen: () => {},
        onDelete: () => {},
        onStart: () => {},
    });

    // Drive the panel into its code state by pressing the real button.
    if (wanted === 'code') {
        connect.update();
        const btn = document.querySelector('#connect-slot .sync-btn-primary');
        if (btn) btn.click();
    }

    // `&details=open` shows the long explanation, which is off by default.
    if (new URLSearchParams(location.search).get('details') === 'open') {
        const details = document.querySelector('#connect-slot details');
        if (details) details.open = true;
    }

    document.documentElement.dataset.ready = 'true';
</script>
</body>
</html>
